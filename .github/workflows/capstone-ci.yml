name: Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-validation:
    name: Validate Helm and Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        run: helm lint helm/voting-app --strict

      - name: Render Kubernetes manifests
        run: |
          helm template voting-app helm/voting-app \
            --namespace voting-app \
            > /tmp/voting-app.yaml

          test -s /tmp/voting-app.yaml

  docker-build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: ./vote
            dockerfile: ./vote/Dockerfile
          - service: result
            context: ./result
            dockerfile: ./result/Dockerfile.prod
          - service: worker
            context: ./worker
            dockerfile: ./worker/Dockerfile.prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: capstone-${{ matrix.service }}:ci
